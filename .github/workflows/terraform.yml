name: terraform

on:
  push:
    paths:
      - .github/workflows/terraform.yml
      - terraform/**
  workflow_dispatch:
    inputs:
      command:
        description: The Terraform command to run
        type: choice
        required: true
        options:
          - plan
          - apply

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.16.0 <2.0.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-2
          role-to-assume: |
            ${{ (
              github.ref == 'refs/heads/main'
              && 'arn:aws:iam::340554939768:role/terraform-apply'
              || 'arn:aws:iam::340554939768:role/terraform-plan'
            ) }}

      - name: plan
        if: github.ref != 'refs/heads/main' || inputs.command == 'plan'
        run: |
          terraform init 2>&1
          terraform plan 2>&1

      - name: apply
        if: github.ref == 'refs/heads/main' && inputs.command != 'plan'
        run: |
          terraform init 2>&1
          terraform apply -auto-approve 2>&1
